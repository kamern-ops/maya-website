<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LIFE WORK OF MAYA YIVGI - NEON OCEAN EXPERIENCE</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; 
            background-color: #39ff14; /* ירוק ניאון */
            font-family: 'Segoe UI', sans-serif; 
            color: #000000; text-align: center; 
            overflow: hidden; position: relative; 
            cursor: none; /* חובה! מסתיר את המצביע כדי שהמדוזה תחליף אותו */
        }

        h1 {
            font-size: 3.5rem; color: #000000; font-weight: 900;
            z-index: 10; margin-top: 30px;
            text-shadow: 2px 2px 0px #ff007f;
        }

        /* קונטיינר התמונה ואפקט האודות */
        .image-container {
            position: relative;
            width: 80%; max-width: 500px; height: 300px;
            margin-bottom: 50px; z-index: 10;
            border-radius: 20px; overflow: hidden;
            border: 5px solid #ff007f;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .main-image {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* שכבת ה"אודות" */
        .about-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* כהה יותר לקונטרסט מעולה */
            color: #39ff14; /* ירוק ניאון */
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; /* מוסתר כברירת מחדל */
            transition: opacity 0.4s ease;
            padding: 20px; box-sizing: border-box;
        }

        .about-overlay h2 {
            margin: 0 0 10px 0; color: #ff007f;
            text-shadow: 0 0 10px #ff007f; font-size: 2rem;
        }

        /* פיצ'ר חדש 2: טקסט אודות פועם (ביולומינסנציה) */
        .about-overlay p {
            font-size: 1.4rem; font-weight: bold; line-height: 1.6;
            animation: biolum-pulse 3s infinite ease-in-out; /* החלת האנימציה הפועמת */
        }

        /* הגדרת האנימציה הפועמת */
        @keyframes biolum-pulse {
            0%, 100% {
                text-shadow: 0 0 5px #39ff14, 0 0 10px rgba(57, 255, 20, 0.5);
                opacity: 0.8;
            }
            50% {
                text-shadow: 0 0 15px #39ff14, 0 0 25px #ff007f, 0 0 35px rgba(255, 0, 127, 0.5);
                opacity: 1;
            }
        }

        /* הפעלת האפקטים במעבר עכבר */
        .image-container:hover .about-overlay { opacity: 1; }
        .image-container:hover .main-image { transform: scale(1.1); }
        .image-container:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); }

        .star-button {
            display: inline-block; width: 160px; height: 160px;
            background-color: #ff8c00; color: #ffffff;
            font-size: 1.5rem; font-weight: bold; text-decoration: none;
            line-height: 160px; cursor: pointer; transition: 0.3s;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 10; position: relative;
        }
        .star-button:hover { transform: scale(1.1) rotate(15deg); filter: brightness(1.1); }

        .bubble {
            position: absolute; background: #ff007f; border-radius: 50%;
            bottom: -250px; filter: blur(3px); animation: rise linear infinite;
            box-shadow: 0 0 30px #ff007f; opacity: 0.8; z-index: 1;
            aspect-ratio: 1 / 1; 
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-1400px) scale(2.5); opacity: 0; }
        }

        #music-control {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 0, 127, 0.2); border: 2px solid #ff007f;
            border-radius: 50%; width: 70px; height: 70px;
            font-size: 40px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #ff007f;
        }

        .singing {
            animation: vibrate 0.3s infinite;
            background: #ff8c00 !important;
            box-shadow: 0 0 30px #ff8c00 !important;
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(2px, -2px) rotate(5deg); }
            50% { transform: translate(-2px, 2px) rotate(-5deg); }
            100% { transform: translate(0); }
        }

        /* פיצ'ר חדש 1: סגנון עבור המדוזה (ראש העכבר) */
        #jellyfish-head {
            position: fixed;
            width: 30px; /* ראש קטן */
            height: 25px;
            background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 0, 127, 0.2) 60%, transparent 100%);
            border-radius: 50% 50% 10% 10%; /* צורת פעמון מדוזה */
            pointer-events: none; /* חשוב! לא מפריע ללחיצות */
            z-index: 10000; /* תמיד מעל הכל */
            opacity: 0; /* מוסתר עד שהעכבר זז */
            transition: opacity 0.3s ease;
            filter: blur(1px); /* מראה אורגני ורך */
        }

        /* זרועות הנצנצים משתרכות מאחור */
        .sparkle {
            position: absolute; pointer-events: none; border-radius: 50%;
            animation: tentacle-fall 1s ease-out forwards; z-index: 999;
            filter: blur(1px); /* רך יותר */
        }

        @keyframes tentacle-fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(30px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="jellyfish-head"></div>

    <button id="music-control" onclick="toggleMusic()">🐠</button>
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="bubble" style="width: 100px; left: 5%; animation-duration: 7s; animation-delay: -1s;"></div>
    <div class="bubble" style="width: 160px; left: 15%; animation-duration: 10s; animation-delay: -5s;"></div>
    <div class="bubble" style="width: 80px; left: 30%; animation-duration: 6s; animation-delay: -2s;"></div>
    <div class="bubble" style="width: 130px; left: 45%; animation-duration: 12s; animation-delay: -8s;"></div>
    <div class="bubble" style="width: 150px; left: 60%; animation-duration: 11s; animation-delay: -3s;"></div>
    <div class="bubble" style="width: 90px; left: 75%; animation-duration: 9s; animation-delay: -6s;"></div>
    <div class="bubble" style="width: 140px; left: 90%; animation-duration: 14s; animation-delay: -4s;"></div>

    <h1>THE LIFE WORK OF MAYA YIVGI</h1>
    
    <div class="image-container">
        <img src="maya.website.index.jpeg" alt="Maya Yivgi" class="main-image">
        <div class="about-overlay">
            <h2>אודות</h2>
            <p>ביולוגית ימית נועזת,<br>אוהבת חתולים וחברים,<br>המשך יבוא...</p>
        </div>
    </div>
    
    <a href="maintenance.html" class="star-button">גלו עוד</a>

    <script>
        const music = document.getElementById('bg-music');
        const fish = document.getElementById('music-control');
        const jellyfishHead = document.getElementById('jellyfish-head');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                fish.classList.add('singing');
                fish.innerHTML = '🐡';
            } else {
                music.pause();
                fish.classList.remove('singing');
                fish.innerHTML = '🐠';
            }
        }

        // אפקט מדוזה ונצנצים (עכבר)
        document.addEventListener('mousemove', function(e) {
            // מיקום ראש המדוזה (מרכז את הפעמון על המצביע)
            jellyfishHead.style.left = (e.clientX - 15) + 'px'; 
            jellyfishHead.style.top = (e.clientY - 12) + 'px';
            jellyfishHead.style.opacity = 1; // הצגה בתנועה ראשונה

            // יצירת הנצנצים שמשמשים כ"זרועות" משתרכות
            for (let i = 0; i < 3; i++) { // פחות נצנצים בכל תנועה למראה אורגני
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // התחלת הזרוע מעט מתחת למרכז הראש
                const tentacleStartX = e.pageX + (Math.random() - 0.5) * 5; // סטייה קלה לרוחב
                const tentacleStartY = e.pageY + 10; // מתחת לראש

                sparkle.style.left = tentacleStartX + 'px';
                sparkle.style.top = tentacleStartY + 'px';
                
                const size = Math.random() * 8 + 2 + 'px'; // גדלים קטנים יותר ואורגניים
                sparkle.style.width = size;
                sparkle.style.height = size; 

                // פלטת צבעים תואמת
                const colors = ['#ff007f', '#ff8c00', '#ffffff'];
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // הוספת אור לתחתית הנצנצים
                sparkle.style.boxShadow = `0 0 5px ${sparkle.style.backgroundColor}`;

                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000); // חיים לשניה אחת
            }
        });
    </script>
</body>
</html>
